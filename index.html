<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <title>Drink Tracker</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="icon-192.png">

  <!-- p5.js -->

  <!-- your app -->

<style id="ios_fix_css">
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
  }

  body {
    position: fixed;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
</style>
  
</head>

<body style="margin:0; overflow:hidden; touch-action:none;">

<script>
document.addEventListener('touchstart', function(e) {
  e.preventDefault();
}, { passive: false });
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
  });
}
</script>

</body>
</body>
</html>
